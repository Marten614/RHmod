l_russian:
 jew_faction_idea: "Гордое одиночество"
 jew_faction_idea_desc: "Великая война идёт уже довольно-таки давно и СРТ воюет с Цыганистаном на нашей стороне, однако Беньямин Нетаньяху наотрез отказывается от прямого военного сотрудничества с Рассолом и Табуретками. У местных патриотов это вызывает своеобразный 'стояк', мол нам не нужна помощь в освобождении наших территорий, но на деле это скорее лишь вызывает раздражение у СРТ. В случае серьёзных потрясений они могут стать нашими врагами."
 gypsy_mobilisation_idea: "Тотальная неэффективность мобилизации"
 gypsy_mobilisation_idea_desc: "3 года тотальной войны на уничтожение между Анти-Еврейским Альянсом и СРТ привели к тому, что народ отказывется идти на войну и повально уклоняется от службы, а мобилизованные регулярно дезертируют из частей."