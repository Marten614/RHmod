l_russian:
 RASSOL_WORLD_NAME: "Агония Мира Рассола"
 RASSOL_WORLD_DESC: "Миру Рассола стукнул 3333 год, третий юбилей с момента появления Рассола. Но, к сожалению, мир встречает его не салютами и радостью, а Великой войной, которая уже продолжается 11 лет. Союз Рассольных Табуреток начал высадку на оккупированную Цыганистаном территорию Еврейского Государства, цыганская предсмертная агония продолжается. На что пойдёт цыганское государство в попытке сохранить своё существование?"
 GATHERING_STORM_NAME: "Агония Мира Рассола"
 GATHERING_STORM_DESC: "Миру Рассола стукнул 1111 год, первый юбилей с момента появления Рассола. Но, к сожалению, мир встречает его не салютами и радостью, а Великой войной, которая уже продолжается 3 год. Союз Рассольных Табуреток начал высадку на оккупированную Цыганистаном территорию Еврейского Государства, цыганская предсмертная агония продолжается. На что пойдёт цыганское государство в попытке сохранить своё существование?"