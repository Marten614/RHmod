 GYP_Alexsey_Gypsy: "Алексей Гипси"
 POLITICS_ALEXSEY_GYPSY_DESC: "Алексей Гипси, он же Лёха Цыган - единоличный архитектор цыганского ужаса. Приходится родным братом Беньямину Нетаньяху. \n\nКогда-то ранее они оба правили одним единым государством, но из-за разногласий Лёха провозгласил независимость Цыганистана, а позже отхапал огромные территории за счёт ранних малых государств. В конечном итоге Цыганистан стал одним из мощнейших государств мира, но из-за своих методов правления нажил себе огромную кучу врагов, в том числе и Еврейское Государство, оставшись с единственным угасающим союзником - Республикой Рюкзаков. На протяжении всего времени независимости Алексей постоянно враждовал с Беньямином (или как он его в шутку называл Бенджамином) Нетаньяху, а в 1108 году начал полномасштабное вторжение на территорию Еврейского Государства, оккупировав все его континентальные территории. Евреи были на грани полного уничтожения, но в этот процесс вмешался Союз Рассольных Табуреток и Южная Конфедерация. \n\nНа данный момент Лёха и сам сильно угасает и у власти его удерживает лишь война. Хотя Цыганистан и находится в агонии, тяга Алексея Гипси к вундерваффе может привести к созданию того самого чудо-оружия, которое сможет предотвратить смерть цыганского государства."

