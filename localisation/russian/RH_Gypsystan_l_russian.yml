 gypsy_RASSOL_WORLD_DESC: "Цыганистанское Национальное Государство, в народе просто Цыганистан - государство построенное на тотальном подавлении, милитаризме и экспансии. В прошлом это единое с еврееями государство, но разделённое враждой братьев Алексея Цыгана и Беньямина Нетаньяху. На данный момент страна находится в плачевном положении - народ не хочет продолжать войну на излёт с Союзом Рассольных Табуреток, экономика разрушена, солдаты бросают свои позиции, а СРТ начала высадку на бывшую территорию Еврейского Государства. Единственное, в чём Цыганистан преуспевает - это в технологиях и, возможно, эти технологии смогут спасти его от краха."
