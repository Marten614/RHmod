communist_subtype_desc: "Коммунизм - это, мягко говоря, поляризующая идеология. Как бы его ни осуждали, как бы за ним ни следили, можно с уверенностью сказать, что он, наряду с национал-социализмом, был одной из определяющих идеологий XX века. Но что же такое коммунизм?\n\nОтталкиваясь от мысли Маркса и Энгельса и претендуя на наследие революции Ленина, она верит в необходимость авангардной партии для руководства и направления пролетариата. Ее приверженцы твердо верят в концепцию классовой борьбы и ставят своей целью свержение буржуазии для установления диктатуры пролетариата, то есть государства, в котором правящий класс и рабочий класс составляют одно целое. Неотъемлемым условием коммунизма является также то, что средства производства принадлежат трудящимся либо непосредственно, либо через государство, которое выступает в качестве посредника.\n\nХотя некоторые движения верят в выборность, большинство направлений коммунизма являются ярыми революционерами и неустанно выступают за наступление революции через праксис, или прямое действие. Разумеется, критиков хватает со всех сторон: от людей, утверждающих, что человеческая природа по своей сути индивидуалистична и эгоистична, до социалистов, осуждающих средства, используемые для установления диктатуры пролетариата, - коммунизм не лишен своих недоброжелателей. И все же коммунисты всех мастей продолжают борьбу, поскольку знают, что когда рабочие всего мира объединятся, им нечего будет терять, кроме своих цепей."
socialist_subtype_desc: "Социализм - это много разных вещей, в зависимости от того, кого вы спрашиваете. Революционный или реформистский, марксистский или утопический, он есть и всегда имел разные формы. Но одно остается неизменным: это идеология народа и для народа.\n\nОдной из основных характеристик социализма, конечно же, является общественная собственность на средства производства. Хотя она может вводиться постепенно со временем или сразу в случае революции, это одна из заявленных целей, поскольку приверженцы этой идеологии считают, что это способ создать справедливую, более честную экономику, построенную для многих, а не для немногих. Также важным для социализма является установление демократии на рабочем месте, дающей работнику право голоса в вопросах функционирования его предприятия, и это часто сочетается с большим, чем обычно, акцентом на политической демократии, будь то избирательная или советская.\n\nНа протяжении веков социализм одинаково восхваляли и поносили. И все же он идет вперед. Несмотря на трудности и неудачи, социализм продолжает свой почти неумолимый путь, стремясь освободить рабочего и простого человека от тирании капитализма."
progressivism_subtype_desc: "Умеренный ответ на эксцессы капитализма, прогрессивизм, состоящий из умеренных социал-демократов и левоцентристских прогрессистов, стремится быть чем-то средним между социал-либерализмом и социал-демократией, с акцентом на экономическую эффективность, умеренное государство всеобщего благосостояния и основной упор на социальную справедливость. Прагматичный и готовый к компромиссам, прогрессивизм верит в постепенные изменения с течением времени, с упором на то, чтобы сделать капитализм более гуманным, позволяя при этом сохранять его лучшие стороны.\n\nПрогрессивизм считает, что нужно дать возможность свободному рынку взять верх, сохраняя при этом государство всеобщего благосостояния, призванное ловить тех, кто попадает в трещины. Вместо того, чтобы сосредоточиться на экономическом равенстве, прогрессивизм намерен бороться с институциональными проблемами, которые вредят равенству возможностей. Расизм, сексизм и другие "измы" являются главными врагами прогрессивистов, которые считают, что государство должно защищать слабых.\n\nВ экономическом плане прогрессивизм считает, что государственное управление неэффективно и что частный рынок при государственном надзоре может быть выгоден обеим сторонам. Это касается вопросов инфраструктуры, здравоохранения и даже основных государственных операций. При такой эффективности бедность может быть ликвидирована за счет экономии расходов на социальное обеспечение и возможностей для лучшей жизни."
liberalism_subtype_desc: "Семя, которое было посажено в залах древних Афин, пустило корни в огне французской революции и, наконец, расцвело в мире в американской Декларации независимости; глубокий смысл слова "либерализм", корни которого уходят в слово "свобода", стал одной из самых преобразующих политических философий, вероятно, в мировой истории; На базовом уровне либерализм провозглашает самоочевидную истину, что все люди созданы равными, им гарантировано право на равенство перед законом, представительство и ответственность, и что они имеют право на эти вещи независимо от воспитания, класса или страны происхождения; и хотя вопрос о том, кто на что претендует, был - а во многих местах и остается - давним предметом дебатов, цивилизации, придерживающиеся принципов либерализма на базовом уровне, сохраняют бескомпромиссную верность принципу равенства и свободы.\n\nЭта фундаментальная истина делает практически все формы либерализма де-факто заклятым врагом фашистов и их фанатичных когорт, стремящихся стать доминирующим политическим компасом мира вопреки Новому мировому порядку, и хотя дело либерализма потерпело почти смертельный удар в результате поражения во второй мировой войне, Хотя бывшие великие либеральные демократии Франции и Великобритании пали под нацистами, оно продолжает жить в либеральных демократиях Западного полушария, и даже если они, или весь мир, будут раздавлены под сапогом, оно никогда не будет вытеснено из человеческого сознания; Пока хоть один человек обладает собственной волей, огонь свободы не погаснет."
liberal_conservatism_subtype_desc: "В мире, до краев наполненном радикалами, экстремистами и бродягами, рациональный человек является, возможно, самой большой надеждой человечества. Чтобы сохранить ценности демократии, этой блестящей идеи, выкованной на холмах Афин, требуется дисциплина и сильная воля, и либерал-консерваторы - это те, кто держит тонкую нить, поддерживающую факел свободы.\n\nВ отличие от чистых консерваторов, эти люди более открыты для социальных изменений в своем обществе, если они могут быть сдержанными и контролируемыми властями предержащими, адаптируя свою позицию по мере необходимости для управления. В целом они поддерживают экономику свободного рынка, хотя отдельные практики могут расходиться во мнениях по вопросу вмешательства государства в экономику как средства благотворного воздействия на общество и ограничения власти корпораций. Смогут ли эти умеренные пережить остаток 20-го века со всем его абсолютистским насилием и тоталитаризмом, остается под вопросом."
conservatism_subtype_desc: "Будь то политическая идеология или культурная философия, консерватизм, как его определяют, ориентируется на идеалы традиционализма и протекционизма, направленные на сохранение и совершенствование общественных и культурных институтов в соответствии с принятыми общественными нормами, и хотя он традиционно предпочитает правое крыло политического театра, он по своей сути не против сотрудничества с более либеральными элементами на данном форуме, хотя это случается довольно редко. Консерваторы часто одобряют свободную рыночную экономику, основанную на принципе невмешательства, как само собой разумеющееся, и предпочитают жесткую экономию бюджета увеличению государственных расходов с обычной регулярностью.\n\nВ свете краха великих либеральных демократий Франции и Великобритании перед фашистской угрозой в Европе, консерватизм переживает возрождение в тех частях мира, которые до сих пор не были затронуты фашизмом, представляя себя как последнюю линию обороны демократии против все более тоталитарного мира, Отчаянно пытаясь сохранить себя против мрачного призрака Нового мирового порядка, и хотя многие консервативно настроенные политики и правительства не против реформ, многие из них часто оказываются в противоречии со своими более либеральными и прогрессивными современниками на общественной арене."
paternalism_subtype_desc: "Политическая философия, широко подпадающая под обозначение патернализма, существовала в качестве основной этики для множества форм правления на протяжении тысячелетий, от деспотов, монархов до императоров. Идеология, стоящая за патерналистскими формами правления, рассматривает зарождающийся подъем либеральной политической мысли и любое требование социальных реформ как причину нестабильности против старых культурных норм и институтов, и стремится противостоять влиянию того, что они считают идеологической заразой, путем жесткого ограничения прав и свобод, временного или, возможно, постоянного, как средства предотвращения потенциально вредной революции, чтобы сохранить нацию, её общество и культуру для лучшего будущего, уподобляя благополучие своих граждан благополучию родителей по отношению к своим детям.\n\nВ этом отношении трудно игнорировать идеологическое сходство с многочисленными автократическими режимами, господствующими в настоящее время в Европе и Азии; как либеральные, так и консервативные формы демократии отвергают диктаторство, наблюдаемое в патерналистских формах правления, считая его не чем иным, как зачаточной формой зарождающейся фашистской политической мысли. При этом мало кто в патерналистских обществах будет заботиться о мнении своих соседей и часто будет оказывать жесткое сопротивление, политическое или военное, любым попыткам, внутренним или внешним, вытесняя их."
despotism_subtype_desc: "Деспотизм - это широкий термин, который охватывает правительственные системы, где власть сосредоточена у одного человека или группы людей. Эти люди управляют страной по своей воле и почти всегда активно используют армию и полицию, чтобы удержать своих граждан от восстания. Деспотичные правительства очень редко терпят другие идеологии, а когда терпят, то имеют системы, не позволяющие этим группам как-либо получить власть. Оппозиционные силы рассматриваются как враги государства и подвергаются жестоким репрессиям, а если выборы и проводятся, то они либо полностью сфальсифицированы, либо проводятся на должности, не имеющие никакой силы.\n\nДеспотичные правительства также стремятся установить контроль или господство над другими странами и содержат обширные вооруженные силы для завоеваний и защиты режима. Хотя деспотисты могут использовать национализм в качестве причины своей власти, они не настолько националистичны, как фашисты и национал-социалисты, и национализм обычно является скорее оправданием, чем реальной частью повестки дня."
ultranationalism_subtype_desc: "Хотя каждая страна ставит свои интересы выше других, ни одна не делает этого так открыто и гордо, как те страны, которыми управляют ультранационалисты. Эти реакционные режимы, как правило, питают глубокое недоверие к иностранным правительствам и нациям, уделяя внимание лишь одной цели - выживанию своего народа. Фанатичная преданность этнической принадлежности, религии или национальной идентичности служит оправданием для принятия крайних мер, включая готовность терпеть трудности в настоящем ради облегчения бремени будущих поколений.\n\nПоявившаяся в качестве реакции на чрезвычайные лишения или угнетение, идеология ультранационализма присуща нестандартным, радикальным правительствам, которые позиционируют себя спасителями нации. Эти правящие партии нередко вырастают из боевых националистических группировок, представляющих самые разные политические и религиозные направления, и, придя к власти, быстро становятся международными изгоями. Однако для ультранационалистических режимов такое положение является скорее поводом для гордости, чем проблемой, так как доведенное до крайности самоопределение является одним из ключевых столпов их идеологии."
fascism_subtype_desc: "Из всех идеологий, возникших в суматохе после Первой мировой войны, наибольшего успеха в достижении и поддержании власти в Европе добилась идеология, известная как фашизм. Основанный на убеждениях разочарованных коммунистов и авторитарных националистов, фашизм часто характеризуется как "третий путь" из-за его идеологического вдохновения как левыми, так и правыми радикалами. Хотя следы марксистской доктрины все еще можно найти похороненными в его мировоззрении - он охватывает диалектику производителя-паразита, но между нациями, а не между экономическими классами, - его ядовитый национализм ставит в противоречие с интернационалистским мышлением социализма, и это неизбежно привело к насильственному конфликту в Германии, Испании и Италии в межвоенные десятилетия. Во всех случаях фашистские партии в конце концов одерживали победу и загоняли своих социалистических соперников в подполье.\n\nСамые определяющие качества фашизма проистекают из его рабской преданности государству. Правительство, часто находящееся под контролем одного сильного человека, служит окончательным арбитром и авторитетом в стране. Религиозным учреждениям, профсоюзам, частному бизнесу и тому подобному разрешено существовать в той или иной ограниченной форме, хотя их подчинение государственной власти ясно выражено. Правительство также поддерживает национальные мифы, рассказывая истории о благородном народе с прошлой славой, которая была несправедливо отнята у него, и требует, чтобы население нашло силы в единстве и вернуло то, что было давно потеряно. Они насмехаются над либеральными нациями за упадническое самодовольство и социалистическими нациями за то, что они поддались вырождению, но парадоксально рассматривают этих чужаков как надвигающуюся угрозу, которая угрожает уничтожить все, что им дорого."
national_socialism_subtype_desc: "После того как Октябрьская революция вывела коммунизм на мировую арену, в страхе перед красной угрозой начала формироваться противоположная реакция. В Италии эта реакция проявилась в виде фашизма. В Германии - в виде национал-социализма. С падением большевизма, именно национал-социализм стал идеологией, определяющей судьбу Европы.\n\nВозникший из пепла поражения Германии в Первой мировой войне, национал-социализм развивался из радикально антисемитских и националистических идей, изложенных Адольфом Гитлером и Национал-социалистической немецкой рабочей партией, быстро распространяясь по всей Германии из-за слабости Веймарской республики. Восхваляемая своими вождями и навязываемая своим гражданам, эта идеология провозглашает арийцев высшей расой, помещая своих врагов на низшие ступени общества. Такие упадочные народы считаются пригодными лишь для уничтожения или порабощения, дабы освободить место для "жизненного пространства" господствующей расы. Тоталитарное правление в таком государстве становится нормой, а демократия рассматривается как зло, равное коммунизму и либерализму. Классовый конфликт считается уделом "малых народов", замененный корпоративистской "народной общностью", в которой на первое место ставится нация, а не какой-либо социальный класс.\n\nЭта идеология уже определила двадцатый век после окончания Второй мировой войны, став одним из самых ужасных зол, обрушившихся на эту планету. Она вызывает отвращение почти у каждого, что в глазах Германии истолковывается как страх и лишь подтверждает правильность выбранного ею пути. Некоторые задаются вопросом, переживет ли эта идеология продолжающуюся Холодную войну. Другие опасаются, что она уже навсегда оставила свой след в этом мире."

#### OLD DESCS ####
#national_socialism_subtype_desc: "Национал-социализм, железный кулак, сжимающий сердце Европы в течение почти тридцати лет, относится к различным стилям фашизма, которые включают в себя яростный расизм, крайний милитаризм и тоталитарное однопартийное государство, где отдельные люди подчиняются ради общего блага. Он отличается от других форм фашизма своими основными принципами жестоко навязываемой расовой иерархии и агрессивного, геноцидального экспансионизма как "жизненного пространства" для народов своей страны.\n\nВ немецком смысле нацизм держит несколько ключевых арендаторов близко к своему черному сердцу - антисемитизм, укоренившийся в каждом политическом действии; глубокое презрение к традиционным либеральным демократиям, парламентской системе и капитализму; и, наконец, его сильная ненависть к коммунизму. В то время как большинство национал-социалистических стран либо сотрудничают с Германским рейхом, либо непосредственно являются его марионетками, этот термин в настоящее время часто используется для описания различных фашистских движений по всему миру, которые перекликаются с основами нацизма, каждый со своими уникальными атрибутами, такими как радикальный японский империализм."
#ultranationalism_subtype_desc: "Ультранационализм - это порочная смесь бешеного милитаризма и горячей преданности нации превыше всего остального. Ультранационалисты стремятся очистить свои страны от предполагаемого иностранного влияния любого рода. Таким образом, они выступают за автаркию, расслоение и активное военное участие в повседневных делах, чтобы обеспечить независимость страны и "безопасность от внешней коррупции". Идея славного государства является ключом ко всему для ультранационалистов, и они будут призывать образы из прошлого, чтобы пробудить и вдохновить в сочетании с параноидальной и дикой ненавистью к другому и постороннему. Расизм и другие формы дискриминации вплетены во все сферы жизни, чтобы еще больше поднять и отделить идеального соотечественника от тех, кто ему не подходит. Для того, чтобы оправдать свои обещания "великой нации", ультранационализм представляет армию как главный инструмент процветания и величия. Поэтому служение государству таким образом является обязательным для большинства и глубоко прославляется как часть триумфа нации над остальным миром. Ультранационализм часто проявляется как часть желания отомстить иностранным врагам и использует это желание для продвижения нации вперед. Хотя известно, что между каждым ультранационалистическим движением существуют некоторые различия, они никогда не отличаются в своем безумном отчаянии увидеть, как вечная слава прольется дождем на их земли."

